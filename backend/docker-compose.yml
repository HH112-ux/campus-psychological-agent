# 开发/部署基础设施（对齐开发文档：FastAPI + MongoDB + Nginx 单机起步）
# 本地如已安装原生 MongoDB，可跳过 mongo 服务；backend 默认连 localhost:27017。
services:
  mongo:
    image: mongo:7
    container_name: xinyu-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?请在 .env 配置 MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?请在 .env 配置 MONGO_ROOT_PASSWORD}
    # 不向宿主机发布 27017：仅 compose 网络内可访问（容器间用 mongo:27017）。
    # 需要本机调试时用 docker compose exec mongo mongosh 进入，勿恢复端口映射。
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    command: ["mongod", "--bind_ip_all", "--auth"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: xinyu-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 证书容器内路径；对应文件缺失时 entrypoint 直接失败（不降级为 HTTP）
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/server.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/server.key}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-_}
    entrypoint: ["/bin/sh", "/usr/local/bin/xinyu-entrypoint.sh"]
    volumes:
      # 模板在启动时渲染为 /etc/nginx/nginx.conf（占位符见 nginx.conf.template）
      - ./nginx/nginx.conf.template:/etc/nginx/xinyu/nginx.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/usr/local/bin/xinyu-entrypoint.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    profiles: ["prod"]   # 本地开发默认不启动，上线时启用

  api:
    build: .
    container_name: xinyu-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"
    profiles: ["prod"]

volumes:
  mongo-data:
