name: CI

# 质量门：合入 main 前必须全绿（见 CONTRIBUTING.md §5、docs/repo-governance.md §六）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端 · ruff + pytest
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: ruff 静态检查
        working-directory: backend
        run: ruff check .

      - name: pytest
        working-directory: backend
        run: pytest -q
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: xinyu_ci
          WX_MOCK_LOGIN: "true"
          WX_MOCK_OPENID: mock_ci_user
          JWT_SECRET: ci-secret-please-change-0123456789abcdef

  miniprogram:
    name: 小程序 · JS 语法门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check 全量 JS
        run: find miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

  eval:
    name: 评估回归门 · 情绪一致率（E1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt

      # 阈值门：严格一致率 < 80% 时 job 失败；仓库未配 ZHIPU_API_KEY secret 时脚本打印 SKIP 并退出 0
      # MONGO/JWT 仅为满足 pydantic-settings 必填项，评估本身不连接数据库
      - name: 情绪评估回归门
        working-directory: backend
        run: python scripts/eval_emotion_p5.py --gate
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: xinyu_ci
          WX_MOCK_LOGIN: "true"
          JWT_SECRET: ci-secret-please-change-0123456789abcdef
